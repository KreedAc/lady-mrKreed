name: Pubblica il sito

# Ogni push che tocca il file Excel (o il sito) rigenera i dati e ripubblica.
on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; se ne arriva una nuova, quella in coda viene sostituita.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Genera i dati dal file Excel
        run: python scripts/build_data.py

      - name: Genera la pagina unica offline
        run: python scripts/build_data.py --standalone site/piano-offline.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
